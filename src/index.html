<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2a4a" />
    <meta name="description" content="منظومة إدارة المخاطر الموحدة: نظام إدارة المخاطر (الموظفون والمتابعة) وتقييم مسئولي المخاطر — يعملان بالكامل في المتصفح مع تخزين محلي آمن." />
    <title>منظومة إدارة المخاطر الموحدة</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Apply the saved visual theme before first paint (light/dark).
      (function () {
        var t = 'light';
        try { var v = localStorage.getItem('glisse-theme'); if (v === 'light' || v === 'dark') t = v; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
