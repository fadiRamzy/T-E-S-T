name: النشر على GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: اختبار وبناء
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت التبعيات (ملف القفل)
        run: npm ci

      - name: بناء نسخة الإنتاج
        run: npm run build

      # GitHub Pages لهذا المستودع مضبوط على "Deploy from a branch: main /"
      # (build_type=legacy)، فيُقدَّم محتوى جذر main مباشرة. لذلك يجب أن يحتوي
      # جذر المستودع على نسخة الإنتاج المبنية، لأن ملف index.html المصدر الخاص
      # بـ Vite لا يعمل عند تقديمه مباشرة من github.io (صفحة بيضاء فارغة).
      # نحدّث ملفات الجذر من dist في كل نشر.
      - name: "تحديث ملفات الموقع في جذر المستودع (مصدر Pages: main /)"
        continue-on-error: true
        run: |
          cp dist/index.html index.html
          cp dist/favicon.svg favicon.svg
          cp dist/manifest.webmanifest manifest.webmanifest
          rm -rf fonts && cp -r dist/fonts fonts
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg manifest.webmanifest fonts .nojekyll
          git commit -m "نشر نسخة الإنتاج إلى جذر المستودع [skip ci]" || exit 0
          git push origin HEAD:main || exit 0

      - name: رفع مخرجات البناء
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: نشر
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: النشر على GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
